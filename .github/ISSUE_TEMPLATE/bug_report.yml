name: Bug report
description: Report a reproducible bug in a EasyIndie project
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        For security issues, **do not** use this form — see SECURITY.md.
  - type: input
    id: repo-version
    attributes:
      label: Project / version
      description: Which repository and version or commit are you using?
      placeholder: "e.g. OrzMusic v1.2.0 / commit abc1234"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime/toolchain version, browser, etc.
      placeholder: "e.g. macOS 15.0, Swift 6.0; or Ubuntu 24.04, Rust 1.80"
    validations:
      required: false
